# Copy this file into the platform repository at
#   k8s-infrastructure/argocd-apps/sealed-secrets.yaml
# The root Application watches that directory, so committing it deploys it.
#
# This is the first secrets controller in the cluster. Existing secrets stay as
# they are, created by hand; this lab's secrets are the first that live in git.
# That is deliberately a small blast radius for a change the platform roadmap
# has wanted for a while: nothing already running depends on it.
#
# Chart 2.19.2 carries controller v0.39.0, both verified against the chart repo
# on 2026-08-20 rather than recalled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.2
    helm:
      releaseName: sealed-secrets
      values: |
        # kubeseal looks for a controller called sealed-secrets-controller in
        # kube-system by default. Matching that default means every kubeseal
        # command in the runbooks works without extra flags.
        fullnameOverride: sealed-secrets-controller

        # The single node is resource tight and this controller only wakes up
        # when a SealedSecret changes.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

        metrics:
          serviceMonitor:
            # kube-prometheus-stack only selects objects labelled with its
            # release name. Enable this once the agent's ServiceMonitor has
            # proven the pattern in phase 5.
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRD ships with the chart and must be applied before the controller.
      - ServerSideApply=true
