name: CI

# No path filter. The sibling repositories filter per application because they
# hold several; here the repository is the project, so any file can change the
# result and skipping a run would only ever hide a break.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first: no value in finishing a run against code
  # nobody will merge.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if the lock file and pyproject.toml disagree, so a
      # dependency added without relocking breaks here rather than resolving to
      # something different from what was tested locally.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # No network, no cluster, no API key. If this ever needs one, the claim
      # that the repository runs standalone has quietly stopped being true.
      - name: Test
        run: uv run pytest

      # The committed workflows are the source of truth for the n8n instance, so
      # they are checked like code. This needs no API key: it catches a
      # hand-edited file that kept a read-only field, a missing required field,
      # and a manifest that has drifted from the files beside it, all of which
      # would otherwise surface as a 400 during a deploy.
      - name: Validate n8n workflows
        run: uv run opsagent n8n validate
